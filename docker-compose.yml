services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: makerspace
      POSTGRES_PASSWORD: makerspace
      POSTGRES_DB: makerspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makerspace -d makerspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Optional. Telemetry rate limits are in-process until a later phase needs shared state.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
