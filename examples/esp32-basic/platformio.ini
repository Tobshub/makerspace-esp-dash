; PlatformIO starter for a makerspace ESP32.
; Wi-Fi, MQTT, telemetry, and command handling are filled in during Phase 13.
; Never commit real Wi-Fi or device secrets.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson
