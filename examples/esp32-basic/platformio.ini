; PlatformIO starter for a makerspace ESP32.
; Copy Wi-Fi and device credentials into src/main.cpp. Never commit them.
; arduino-mqtt can publish QoS 1. PubSubClient cannot.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.0
